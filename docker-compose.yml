version: '3.8'

services:
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - ./alert_rules.yaml:/etc/prometheus/alert_rules.yaml  # Монтируем файл алертов
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'  # Явно указываем путь к конфигу
    ports:
      - "9090:9090"  # Пробрасываем порт Prometheus наружу

  node_exporter:
    image: prom/node-exporter:latest  # Официальный образ node_exporter
    container_name: node_exporter
    ports:
      - "9100:9100"  # Пробрасываем порт node_exporter наружу

  grafana:
    image: grafana/grafana:latest  # Официальный образ Grafana
    container_name: grafana
    ports:
      - "3000:3000"  # Пробрасываем порт Gr
